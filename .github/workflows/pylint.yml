name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . pytest pylint

      - name: Run tests
        run: pytest

      - name: Run Pylint
        run: pylint hangman_p project.py
